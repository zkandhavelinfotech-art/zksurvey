# Local / single-server deployment. Put a TLS reverse proxy (Caddy, nginx, a cloud load balancer) in front of "app".
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: zksurvey
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U zk -d zksurvey"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://zk:${POSTGRES_PASSWORD}@db:5432/zksurvey
    ports: [ "3000:3000" ]
    restart: unless-stopped
volumes:
  pgdata:
