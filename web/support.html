<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact support — ZKSurvey</title><meta name="description" content=""><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/zk.css"></head><body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar"><div class="container" style="display:flex;width:100%"><a class="logo" href="index.html"><span class="logo-mark">ZK</span><span class="logo-text">ZKSurvey<small>Survey &amp; Launch Intelligence</small></span></a><nav class="nav" aria-label="Main"><a href="index.html#how">How it works</a><a href="index.html#channels">Channels</a><a href="index.html#usecases">Use cases</a><a href="pricing.html">Pricing</a><span id="authNav" style="display:flex;gap:10px;align-items:center"><a href="login.html">Sign in</a><a class="btn btn-primary" href="register.html">Start free</a></span></nav></div></header>
<main id="main">
<section class="section"><div class="container" style="max-width:460px"><div class="zk-card"><h1 style="font-size:28px;color:#fff;margin:0 0 6px">Contact support</h1><p class="sub">Tell us what you need. We reply by email.</p><div id="msg" role="status" aria-live="polite" style="font-size:14px;margin:8px 0;color:#9ce6ff"></div><form id="f" novalidate><label class="zk-label" for="n" style="margin-top:0">Your name</label><input class="zk-input" id="n" autocomplete="name"><label class="zk-label" for="e">Email</label><input class="zk-input" id="e" type="email" autocomplete="email"><label class="zk-label" for="s">Subject</label><input class="zk-input" id="s"><label class="zk-label" for="m">Message</label><textarea class="zk-textarea" id="m" rows="5"></textarea><input type="text" id="w" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><button class="zk-btn primary" style="width:100%;margin-top:14px" type="submit">Send message</button></form></div></div></section>
</main>
<script src="js/auth.js"></script><script>var u=ZKAuth.current();if(u){n.value=u.name;e.value=u.email;}document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var r=ZKApi.call("POST","/support",{name:n.value,email:e.value,subject:s.value,message:m.value,website:w.value});var g=document.getElementById("msg");g.style.color=r.status===201?"#9ce6ff":"#ffb4c0";g.textContent=r.status===201?"Thanks — we have your message.":(r.data.message||"Could not send.");if(r.status===201)f.reset();};</script><script src="js/shell.js"></script></body></html>
