<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password — ZKSurvey</title><meta name="description" content=""><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/zk.css"></head><body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar"><div class="container" style="display:flex;width:100%"><a class="logo" href="index.html"><span class="logo-mark">ZK</span><span class="logo-text">ZKSurvey<small>Survey &amp; Launch Intelligence</small></span></a><nav class="nav" aria-label="Main"><a href="index.html#how">How it works</a><a href="index.html#channels">Channels</a><a href="index.html#usecases">Use cases</a><a href="pricing.html">Pricing</a><span id="authNav" style="display:flex;gap:10px;align-items:center"><a href="login.html">Sign in</a><a class="btn btn-primary" href="register.html">Start free</a></span></nav></div></header>
<main id="main">
<section class="section"><div class="container" style="max-width:460px"><div class="zk-card"><h1 style="font-size:28px;color:#fff;margin:0 0 6px">Reset your password</h1><p class="sub">Enter your account email. If it exists, we send a link that works for one hour.</p><div id="msg" role="status" aria-live="polite" style="font-size:14px;margin-bottom:8px;color:#9ce6ff"></div><form id="f" novalidate><label class="zk-label" for="e" style="margin-top:0">Email</label><input class="zk-input" id="e" type="email" autocomplete="username"><button class="zk-btn primary" style="width:100%;margin-top:14px" type="submit">Send reset link</button></form><p class="muted" style="text-align:center;font-size:14px;margin-top:14px"><a href="login.html" style="color:#9ce6ff">Back to sign in</a></p></div></div></section>
</main>
<script src="js/auth.js"></script><script>document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var r=ZKApi.call("POST","/auth/forgot",{email:e.value});document.getElementById("msg").textContent=r.status===200?"If an account exists for that email, a reset link is on its way.":(r.data.message||"Could not send. Try again.");};</script><script src="js/shell.js"></script></body></html>
