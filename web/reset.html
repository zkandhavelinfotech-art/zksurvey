<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password — ZKSurvey</title><meta name="description" content=""><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/zk.css"></head><body>

<header class="topbar"><div class="container" style="display:flex;width:100%"><a class="logo" href="index.html"><span class="logo-mark">ZK</span><span class="logo-text">ZKSurvey<small>Survey &amp; Launch Intelligence</small></span></a><nav class="nav" aria-label="Main"><a href="index.html#how">How it works</a><a href="index.html#channels">Channels</a><a href="index.html#usecases">Use cases</a><a href="pricing.html">Pricing</a><span id="authNav" style="display:flex;gap:10px;align-items:center"><a href="login.html">Sign in</a><a class="btn btn-primary" href="register.html">Start free</a></span></nav></div></header>
<main id="main">
<section class="section"><div class="container" style="max-width:460px"><div class="zk-card"><h1 style="font-size:28px;color:#fff;margin:0 0 6px">Choose a new password</h1><div id="errs" role="alert" aria-live="polite" style="color:#ffb4c0;font-size:14px;margin:8px 0"></div><form id="f" novalidate><label class="zk-label" for="p" style="margin-top:0">New password <span class="muted" style="text-transform:none;font-weight:400">(8+ characters, a letter and a number)</span></label><input class="zk-input" id="p" type="password" autocomplete="new-password"><button class="zk-btn primary" style="width:100%;margin-top:14px" type="submit">Update password</button></form></div></div></section>
</main>
<script src="js/auth.js"></script><script>var tk=new URLSearchParams(location.search).get("token")||"";if(!tk)document.getElementById("errs").textContent="This reset link is incomplete. Request a new one.";document.getElementById("f").onsubmit=function(ev){ev.preventDefault();var r=ZKApi.call("POST","/auth/reset",{token:tk,password:p.value});if(r.status===200){location.href="login.html?msg=reset";return;}document.getElementById("errs").textContent=r.data.message||"Could not reset.";};</script><script src="js/shell.js"></script></body></html>
